[project]
name = "chelsea-matchday-hub"
version = "0.1.0"
description = "A Flask-based Chelsea FC matchday dashboard featuring upcoming fixtures, recent match results, and Premier League standings powered by the football-data.org API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "flask-caching>=2.4.1",
    "gunicorn>=27.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]


[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
